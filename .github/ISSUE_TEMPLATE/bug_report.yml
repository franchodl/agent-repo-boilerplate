name: Bug report
description: Report a reproducible problem with this starter.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For security issues, do not use this form. Follow [SECURITY.md](https://github.com/franchodl/agent-repo-boilerplate/blob/main/SECURITY.md)."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable set of steps.
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, and tool versions.
    validations:
      required: false
